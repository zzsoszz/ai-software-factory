name: Factory checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check factory installation
        run: python3 scripts/check_factory.py
      - name: Test factory policy behavior
        run: python3 -m unittest discover -s tests -v
